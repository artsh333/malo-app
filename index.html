<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MALO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0D0A0C;--s1:#1A1218;--s2:#2A1621;--line:#3A2533;--line2:#4A2A3C;--pink:#FF2E93;--soft:#FFB8D6;--text:#FFF4F8;--muted:#C9A9B9;--dim:#8E7383;--ink:#1A0610}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,'Segoe UI',system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:20px 18px 48px;display:flex;flex-direction:column;gap:20px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pink)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.sec{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;text-transform:uppercase}
.card{background:var(--s1);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:12px;color:var(--muted)}
.hand{font-family:Caveat,cursive;font-weight:700}
.logo{font-family:'Rubik Wet Paint',Impact,sans-serif;font-size:52px;line-height:.95;color:var(--pink);transform:rotate(-6deg);display:inline-block}
.btn{border:none;background:var(--pink);color:var(--ink);font-weight:800;font-size:16px;padding:16px;border-radius:16px;width:100%}
.btn:disabled{opacity:.4}
.btn2{border:1px solid var(--line2);background:none;color:var(--text);font-weight:600;font-size:14px;padding:10px 14px;border-radius:12px;white-space:nowrap}
.btn2.pink{color:var(--pink);border-color:var(--pink)}
.btn2.sm{padding:7px 10px;font-size:12px}
.back{width:44px;height:44px;border-radius:22px;background:var(--s1);border:none;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.h1{font-size:24px;font-weight:800}
.hero{background:var(--pink);color:var(--ink);border-radius:24px;padding:22px;border:none;text-align:left;position:relative;width:100%;display:flex;flex-direction:column;gap:6px}
.hero .t{font-size:26px;font-weight:800;line-height:1.1}
.hero .arr{position:absolute;right:20px;bottom:20px;width:48px;height:48px;border-radius:24px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.hero2{background:var(--s1);border:1.5px solid var(--pink);color:var(--text);border-radius:24px;padding:20px 22px;text-align:left;width:100%}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day b{font-size:18px}.day span{font-size:11px;font-weight:600}
.day.on,.slot.on,.chip.on{background:var(--pink);color:var(--ink);border-color:var(--pink)}
.slot{height:54px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.slot b{font-size:15px}.slot span{font-size:10px;font-weight:600}
.slot.busy{background:#2A1E25;color:var(--dim);border-color:transparent;text-decoration:line-through}
.slot.ev{background:none;border:1px dashed var(--soft);color:var(--soft)}
.chip{border:1px solid var(--line);background:var(--s1);color:var(--text);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tag{font-size:11px;font-weight:800;letter-spacing:1px;padding:5px 9px;border-radius:10px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.dim{background:var(--s1);color:var(--soft);letter-spacing:0;font-weight:600;font-size:12px;padding:8px 12px}
.datebox{width:58px;height:62px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.datebox b{font-size:22px;color:var(--pink);line-height:1}.datebox span{font-size:11px;font-weight:700;color:var(--soft)}
.evcard{background:var(--s1);border:none;color:var(--text);border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--text);font-size:22px}
.stepper b{font-size:22px;min-width:32px;text-align:center}
label.opt{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
label.opt input{width:20px;height:20px;accent-color:var(--pink);flex-shrink:0;padding:0}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hour{display:flex;gap:10px;align-items:stretch}
.hour .t{width:46px;font-size:13px;color:var(--muted);padding-top:12px;flex-shrink:0}
.hour .b{flex:1;border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.b.free{border:1px dashed var(--line);color:var(--dim);flex-direction:row;justify-content:space-between;align-items:center;font-size:13px}
.b.bk{background:var(--s2)}
.b.blk{background:var(--s1);border:1px solid var(--line2);flex-direction:row;justify-content:space-between;align-items:center}
.b.evb{border:1px dashed var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:9;width:max-content;max-width:90%;text-align:center}
.center{text-align:center}
.spin{margin:40vh auto 0;width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:s 1s linear infinite}
.spin.in{margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
a{color:var(--pink)}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<script>
// =====================================================================
// MALO — мини-приложение
// =====================================================================
const API_URL = 'https://opdplrclkkjrgcmqbcfl.supabase.co/functions/v1/api';
const CONTACT = 'malo_202';

const tg = window.Telegram && window.Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor('#0D0A0C'); tg.setBackgroundColor('#0D0A0C'); } catch (e) {}

// ---------- Справочники ----------
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_S = ['ЯНВ','ФЕВ','МАР','АПР','МАЯ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];
const METHOD = { transfer: 'Переводом', cash: 'Наличными в зале', online: 'Онлайн' };
const PAY = { pending: 'ждёт предоплату', prepaid: 'предоплата ✓', paid: 'оплачено ✓', refunded: 'возврат' };
const PAY_SHORT = { pending: 'не оплачено', prepaid: 'предоплата', paid: 'оплачено' };
const KIND = { masterclass: 'Мастер-класс', party: 'Вечеринка' };
const BACK = { book: 'home', checkout: 'book', done: 'home', events: 'home', event: 'events', admin: 'home' };

const ICON = {
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  arrow: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF2E93" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  crown: '<svg width="34" height="22" viewBox="0 0 34 22" fill="none" stroke="#FF2E93" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" style="margin-left:26px"><path d="M3 19 L5 5 L12 12 L17 2 L22 12 L29 5 L31 19 Z"/></svg>',
  pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9A9B9" stroke-width="1.8"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};

// ---------- Состояние ----------
const S = {
  data: null, error: null, screen: 'home', busy: false, toast: null,
  book: { date: null, hours: [], people: 1, repeat: false, weeks: 4 },
  form: { name: '', phone: '', purpose: '', method: 'transfer' },
  eventId: null, ticket: { qty: 1, method: 'transfer' }, evFilter: 'all', last: null,
  admin: {
    tab: 'day', date: null, day: null, dayLoading: false, dh: { open: 9, close: 22, closed: false },
    events: null, evLoading: false,
    ne: { title: '', kind: 'masterclass', host: '', date: '', start: 18, end: 20, capacity: 30, price: 0, description: '' },
    bc: ''
  },
  edit: null
};

// ---------- Утилиты ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D = d => new Date(d + 'T00:00:00Z');
const addDays = (d, n) => { const x = D(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fmtDay = d => { const x = D(d); return `${WD[x.getUTCDay()]}, ${x.getUTCDate()} ${MON[x.getUTCMonth()]}`; };
const hh = h => `${h}:00`;
const rub = v => Math.round(v).toLocaleString('ru-RU') + ' ₽';
const mskNow = () => new Date(Date.now() + 3 * 3600e3);
const mskToday = () => mskNow().toISOString().slice(0, 10);
const mskHour = () => mskNow().getUTCHours();
const clone = o => JSON.parse(JSON.stringify(o));
const hoursWord = n => n % 10 === 1 && n % 100 !== 11 ? 'час' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'часа' : 'часов');

const fmtTime = iso => {
  const x = new Date(new Date(iso).getTime() + 3 * 3600e3);
  return `${x.getUTCDate()} ${MON[x.getUTCMonth()]}, ${x.getUTCHours()}:${String(x.getUTCMinutes()).padStart(2, '0')}`;
};

async function compressImage(file) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Не удалось открыть картинку'));
    i.src = URL.createObjectURL(file);
  });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82).split(',')[1];
}

function receiptBlock(b) {
  if (b.payment_method !== 'transfer' || b.payment_status !== 'pending' || b.receipt_at) return '';
  const up = S.uploading === b.id;
  return `<div class="col" style="gap:6px">
    <span class="small" style="color:var(--soft)">${b.pay_deadline ? 'Прикрепите чек о переводе до ' + fmtTime(b.pay_deadline) + ', иначе бронь отменится' : 'Прикрепите чек о переводе'}</span>
    <label class="btn" style="text-align:center;${up ? 'opacity:.5' : ''}">${up ? 'Загружаем…' : 'Прикрепить чек'}
      <input type="file" accept="image/*" data-receipt="${b.id}" style="display:none" ${up ? 'disabled' : ''}></label></div>`;
}
const payLabel = b => b.payment_method === 'transfer' && b.payment_status === 'pending' && b.receipt_at ? 'чек на проверке' : PAY[b.payment_status];

function toast(msg) {
  S.toast = msg; render();
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { S.toast = null; render(); }, 3200);
}

function ask(text) {
  return new Promise(res => {
    if (tg && tg.showConfirm && tg.initData) { try { tg.showConfirm(text, ok => res(!!ok)); return; } catch (e) {} }
    res(window.confirm(text));
  });
}

function setPath(path, val) {
  const ks = path.split('.'); let o = S;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}

async function api(action, params = {}) {
  let r;
  try {
    r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ initData: (tg && tg.initData) || '', action, params })
    });
  } catch (e) { throw new Error('Нет связи с сервером'); }
  const j = await r.json().catch(() => ({ error: 'Ошибка сервера' }));
  if (!r.ok || (j && j.error)) throw new Error((j && j.error) || 'Ошибка');
  return j;
}

async function load() {
  try {
    S.data = await api('bootstrap');
    S.error = null;
    const me = S.data.me;
    const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (!S.form.name) S.form.name = (me.client && me.client.name) || (u && u.first_name) || '';
    if (!S.form.phone) S.form.phone = (me.client && me.client.phone) || '';
  } catch (e) { S.error = e.message; }
  render();
}

// ---------- Расчёты ----------
function dayInfo(date) {
  const o = S.data.dayHours.find(x => x.date === date);
  const s = S.data.settings;
  return o ? { open: o.open_hour, close: o.close_hour, closed: o.is_closed } : { open: s.open_hour, close: s.close_hour, closed: false };
}
function occKind(date, h) { const o = S.data.occupied.find(x => x.date === date && x.hour === h); return o ? o.kind : null; }
function tierFor(n) { return S.data.tiers.find(t => n >= t.min_people && n <= t.max_people); }
const DOWS = [1, 2, 3, 4, 5, 6, 0];
const appliesDay = (d, dow) => !d.weekdays || d.weekdays.includes(dow);
function dayDiscounts(date) {
  const dow = D(date).getUTCDay();
  return S.data.discounts.filter(d => d.active && d.kind === 'time' && appliesDay(d, dow))
    .sort((a, b) => a.start_hour - b.start_hour);
}
function dayPct(date) { return Math.max(0, ...dayDiscounts(date).map(d => d.percent)); }
function discPct(h, date) {
  return Math.max(0, ...dayDiscounts(date).filter(d => h >= d.start_hour && h < d.end_hour).map(d => d.percent));
}
function daysLabel(w) {
  if (!w || w.length === 7) return 'каждый день';
  return DOWS.filter(x => w.includes(x)).map(x => WD[x]).join(', ');
}
function dowChips(path, w) {
  return `<div class="row" style="flex-wrap:wrap;gap:6px">${DOWS.map(x =>
    `<button class="chip ${!w || w.includes(x) ? 'on' : ''}" style="padding:8px 11px;font-size:13px" data-a="toggleDow" data-path="${path}" data-dow="${x}">${WD[x]}</button>`).join('')}</div>`;
}
function getPath(path) { return path.split('.').reduce((o, k) => o[k], S); }
function calc() {
  const t = tierFor(S.book.people); const price = t ? t.price_per_hour : 0;
  let full = 0, disc = 0;
  for (const h of S.book.hours) { full += price; disc += Math.round(price * discPct(h, S.book.date) / 100); }
  const total = full - disc;
  return { price, full, disc, total, prepay: Math.ceil(total * S.data.settings.prepay_percent / 100) };
}
function tapHour(h) {
  const hs = S.book.hours;
  if (!hs.length) { S.book.hours = [h]; return; }
  const min = Math.min(...hs), max = Math.max(...hs);
  if (hs.length === 1 && h === min) S.book.hours = [];
  else if (h === min) S.book.hours = hs.filter(x => x !== min);
  else if (h === max) S.book.hours = hs.filter(x => x !== max);
  else if (h === max + 1 || h === min - 1) S.book.hours = [...hs, h];
  else S.book.hours = [h];
}
function cancelNote(b) {
  const x = D(b.date); x.setUTCHours(b.start_hour - S.data.settings.cancel_hours);
  if (mskNow() > x) return 'Отмена без возврата предоплаты';
  return `Бесплатная отмена до ${x.getUTCDate()} ${MON[x.getUTCMonth()]}, ${hh(x.getUTCHours())}`;
}

// ---------- Общие куски ----------
const header = title => `<div class="row"><button class="back" data-a="back" aria-label="Назад">${ICON.back}</button><div class="h1">${title}</div></div>`;
const dateBox = d => { const x = D(d); return `<div class="datebox"><b>${x.getUTCDate()}</b><span>${MON_S[x.getUTCMonth()]}</span></div>`; };
const field = (label, bind, val, type = 'text', extra = '') =>
  `<div class="field"><label class="lbl" for="${bind}">${label}</label><input id="${bind}" type="${type}" data-bind="${bind}" value="${esc(val)}" ${extra}></div>`;
function evCard(e) {
  return `<button class="evcard" data-a="openEvent" data-id="${e.id}">${dateBox(e.date)}
    <div class="col" style="gap:3px;flex:1;min-width:0">
      <span class="small" style="font-weight:800;letter-spacing:1.5px;color:var(--soft)">${KIND[e.kind].toUpperCase()}</span>
      <b style="font-size:16px">${esc(e.title)}</b>
      <span class="small">${WD[D(e.date).getUTCDay()]}, ${hh(e.start_hour)} · ${e.seats_left > 0 ? 'осталось ' + e.seats_left + ' мест' : 'мест нет'}</span>
    </div>${ICON.arrow}</button>`;
}
function dayStrip(selected, n, action) {
  return `<div class="days">${[...Array(n)].map((_, i) => {
    const d = addDays(mskToday(), i), x = D(d);
    const pct = action === 'pickDay' ? dayPct(d) : 0;
    return `<button class="day ${d === selected ? 'on' : ''}" data-a="${action}" data-date="${d}" style="${pct ? 'height:72px' : ''}"><span>${WD[x.getUTCDay()]}</span><b>${x.getUTCDate()}</b>${pct ? `<span style="font-size:10px">до −${pct}%</span>` : ''}</button>`;
  }).join('')}</div>`;
}

// ---------- Экраны ----------
function vHome() {
  const d = S.data, me = d.me, s = d.settings;
  const minPrice = Math.min(...d.tiers.map(t => t.price_per_hour));
  const ev = d.events[0];
  const tickets = me.tickets.filter(t => t.events && t.events.date >= mskToday());
  return `
  <div class="between" style="align-items:flex-start">
    <div class="col" style="gap:0">${ICON.crown}<span class="logo">MALO</span>
      <span class="small" style="letter-spacing:4px;margin-top:6px">DANCE STUDIO</span></div>
    ${me.isAdmin ? '<button class="btn2 pink" data-a="openAdmin">Админка</button>' : ''}
  </div>
  <div class="row muted">${ICON.pin} Архангельск, пр. Ломоносова, 32</div>
  <button class="hero" data-a="openBook">
    <span class="hand" style="font-size:20px">аренда зала</span>
    <span class="t">Забронировать<br>зал</span>
    <span style="font-size:14px;font-weight:600;margin-top:6px">от ${minPrice} ₽/час · ${hh(s.open_hour)}–${hh(s.close_hour)}</span>
    <span class="arr">${ICON.arrow}</span>
  </button>
  <button class="hero2 between" data-a="openEvents">
    <span class="col" style="gap:4px"><b style="font-size:22px">Афиша</b><span class="muted">Мастер-классы и вечеринки</span></span>${ICON.arrow}
  </button>
  ${ev ? `<div class="col"><div class="sec">Ближайший ивент</div>${evCard(ev)}</div>` : ''}
  ${me.bookings.length ? `<div class="col"><div class="sec">Мои брони</div>${me.bookings.map(b => `
    <div class="card">
      <div class="between"><b style="font-size:16px">${fmtDay(b.date)} · ${hh(b.start_hour)}–${hh(b.end_hour)}</b><span class="tag">${payLabel(b)}</span></div>
      <div class="muted">${b.people} чел. · ${rub(b.total - b.discount)} · предоплата ${rub(b.prepay)}</div>
      ${receiptBlock(b)}
      <div class="between" style="border-top:1px solid var(--line);padding-top:10px"><span class="small">${cancelNote(b)}</span>
      <button class="btn2" data-a="cancelBooking" data-id="${b.id}">Отменить</button></div>
    </div>`).join('')}</div>` : ''}
  ${tickets.length ? `<div class="col"><div class="sec">Мои билеты</div>${tickets.map(t => `

function vBook() {
  const d = S.data, b = S.book, info = dayInfo(b.date);
  const isToday = b.date === mskToday(), nowH = mskHour();
  const timeDisc = dayDiscounts(b.date);
  let slots;
  if (info.closed) slots = '<div class="card center muted">В этот день зал закрыт</div>';
  else {
    slots = '<div class="grid4">';
    for (let h = info.open; h < info.close; h++) {
      const k = occKind(b.date, h), past = isToday && h <= nowH, pct = discPct(h, b.date);
      let cls = 'slot', note = pct ? `−${pct}%` : 'свободно', dis = false;
      if (k === 'event') { cls += ' ev'; note = 'ивент'; dis = true; }
      else if (k) { cls += ' busy'; note = 'занято'; dis = true; }
      else if (past) { cls += ' busy'; note = 'прошло'; dis = true; }
      else if (b.hours.includes(h)) cls += ' on';
      slots += `<button class="${cls}" ${dis ? 'disabled' : ''} data-a="hour" data-h="${h}"><b>${hh(h)}</b><span>${note}</span></button>`;
    }
    slots += '</div>';
  }
  const t = tierFor(b.people), c = calc(), n = b.hours.length;
  return `${header('Бронь зала')}
  <div class="col"><div class="sec">Дата</div>${dayStrip(b.date, 30, 'pickDay')}<div class="muted">${fmtDay(b.date)}</div></div>
  <div class="col">
    <div class="sec">Время</div>
    ${timeDisc.length ? `<div class="row" style="flex-wrap:wrap;gap:6px">${timeDisc.map(x => `<span class="tag dim">−${x.percent}% · ${hh(x.start_hour)}–${hh(x.end_hour)}</span>`).join('')}</div>` : ''}
    ${slots}
    <div class="small">Нажмите на начало и продлите соседними часами</div>
  </div>
  <div class="col"><div class="sec">Сколько вас</div>
    <div class="between"><div class="stepper"><button data-a="people" data-v="-1" aria-label="Меньше">−</button><b>${b.people}</b><button data-a="people" data-v="1" aria-label="Больше">+</button></div>
    <div class="col" style="gap:2px;align-items:flex-end"><b>${t ? t.price_per_hour + ' ₽/час' : '—'}</b><span class="small">${t ? esc(t.label) : ''}</span></div></div>
  </div>
  <label class="opt"><input type="checkbox" data-bind="book.repeat" data-rerender="1" ${b.repeat ? 'checked' : ''}>
    <span class="col" style="gap:2px"><b style="font-size:15px">Повторять каждую неделю</b><span class="small">Для регулярных тренировок</span></span></label>
  ${b.repeat ? `<div class="between"><span class="muted">Сколько недель</span><div class="stepper"><button data-a="weeks" data-v="-1" aria-label="Меньше">−</button><b>${b.weeks}</b><button data-a="weeks" data-v="1" aria-label="Больше">+</button></div></div>` : ''}
  <div class="card" style="margin-top:auto">
    ${n ? `<div class="between muted"><span>${hh(Math.min(...b.hours))}–${hh(Math.max(...b.hours) + 1)} · ${n} ${hoursWord(n)} × ${c.price} ₽</span><span>${rub(c.full)}</span></div>
    ${c.disc ? `<div class="between" style="color:var(--soft);font-size:14px"><span>Скидка</span><span>−${rub(c.disc)}</span></div>` : ''}
    <div class="between" style="border-top:1px solid var(--line);padding-top:10px"><b>Предоплата ${d.settings.prepay_percent}%</b><b style="font-size:24px;color:var(--pink)">${rub(c.prepay)}</b></div>
    ${b.repeat ? `<span class="small">Цена за одну неделю, всего ${b.weeks} нед.</span>` : ''}` : '<div class="muted center">Выберите время</div>'}
    <button class="btn" data-a="toCheckout" ${n ? '' : 'disabled'}>Продолжить</button>
  </div>`;
}

function vAdminDay() {
  const A = S.admin, s = S.data.settings;
  let body = '<div class="spin in"></div>';
  if (A.day) {
    const day = A.day;
    const di = day.dayHours ? { open: day.dayHours.open_hour, close: day.dayHours.close_hour, closed: day.dayHours.is_closed } : { open: s.open_hour, close: s.close_hour, closed: false };
    const occ = {}; day.occupied.forEach(o => occ[o.hour] = o);
    const hrs = Object.keys(occ).map(Number);
    const from = Math.min(di.open, ...hrs), to = Math.max(di.close, ...hrs.map(h => h + 1));
    const row = (h, inner) => `<div class="hour"><div class="t">${hh(h)}</div>${inner}</div>`;
    const seen = new Set(); let rows = '';
    for (let h = from; h < to; h++) {
      const o = occ[h];
      if (o && o.booking_id) {
        if (seen.has(o.booking_id)) continue; seen.add(o.booking_id);
        const b = day.bookings.find(x => x.id === o.booking_id); if (!b) continue;
        const cl = b.clients || {};
        rows += row(h, `<div class="b bk">
          <b>${esc(cl.name)} · ${hh(b.start_hour)}–${hh(b.end_hour)}</b>
          <span class="small">${b.people} чел. · ${rub(b.total - b.discount)} · предоплата ${rub(b.prepay)} · ${METHOD[b.payment_method]}</span>
          <span class="small"><a href="tel:${esc(cl.phone)}" style="color:var(--soft)">${esc(cl.phone)}</a>${cl.username ? ' · @' + esc(cl.username) : ''}</span>
          ${b.purpose ? `<span class="small">Цель: ${esc(b.purpose)}</span>` : ''}
          ${b.series_id ? '<span class="small">еженедельная бронь</span>' : ''}
          ${b.payment_status === 'pending' && b.receipt_at ? '<span class="small" style="color:var(--soft)">Чек прислан — проверьте перевод</span>' : ''}
          ${b.payment_status === 'pending' && !b.receipt_at && b.pay_deadline ? `<span class="small">Ждём чек до ${fmtTime(b.pay_deadline)}</span>` : ''}
          <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:4px">
            ${b.receipt_path ? `<button class="btn2 pink sm" data-a="aReceipt" data-id="${b.id}">Чек</button>` : ''}
            ${['pending', 'prepaid', 'paid'].map(st => `<button class="chip ${b.payment_status === st ? 'on' : ''}" style="padding:7px 10px;font-size:12px" data-a="setPay" data-kind="booking" data-id="${b.id}" data-v="${st}">${PAY_SHORT[st]}</button>`).join('')}
            <button class="btn2 sm" data-a="cancelBooking" data-id="${b.id}">Отменить</button>
          </div></div>`);
      } else if (o && o.event_id) {
        if (seen.has(o.event_id)) continue; seen.add(o.event_id);
        const e = day.events.find(x => x.id === o.event_id);
        rows += row(h, `<div class="b evb"><b>${esc(e ? e.title : 'Ивент')}</b><span class="small">${e ? hh(e.start_hour) + '–' + hh(e.end_hour) + ' · ' + KIND[e.kind] : ''}</span></div>`);
      } else if (o) {
        rows += row(h, `<div class="b blk"><span class="muted">${esc(o.block_reason)}</span><button class="btn2 pink sm" data-a="aUnblock" data-h="${h}">Открыть</button></div>`);
      } else {
        const out = di.closed || h < di.open || h >= di.close;
        rows += row(h, `<div class="b free"><span>${out ? 'вне часов работы' : 'свободно'}</span>${out ? '' : `<button class="btn2 sm" data-a="aBlock" data-h="${h}">Закрыть</button>`}</div>`);
      }
    }
    body = `<div class="col" style="gap:8px">${rows}</div>
    <div class="card"><b>Часы работы в этот день</b>
      <div class="grid2">${field('Открытие', 'admin.dh.open', A.dh.open, 'number', 'min="0" max="23"')}${field('Закрытие', 'admin.dh.close', A.dh.close, 'number', 'min="1" max="24"')}</div>
      <label class="opt"><input type="checkbox" data-bind="admin.dh.closed" ${A.dh.closed ? 'checked' : ''}><span>Выходной — зал закрыт весь день</span></label>
      <div class="grid2"><button class="btn2 pink" data-a="aDayHours">Сохранить</button><button class="btn2" data-a="aDayReset">Как обычно</button></div>
      ${day.dayHours ? '<span class="small">Для этого дня заданы особые часы</span>' : `<span class="small">Обычные часы: ${hh(s.open_hour)}–${hh(s.close_hour)}</span>`}
    </div>`;
  }
  return `${dayStrip(A.date, 30, 'aDay')}<div class="sec">${fmtDay(A.date)}</div>${body}`;
}

    <div class="field"><label class="lbl" for="nek">Тип</label><select id="nek" data-bind="admin.ne.kind">

    <div class="grid2">${field('Начало (час)', 'admin.ne.start', ne.start, 'number', 'min="0" max="23"')}${field('Конец (час)', 'admin.ne.end', ne.end, 'number', 'min="1" max="24"')}</div>
    <div class="grid2">${field('Мест', 'admin.ne.capacity', ne.capacity, 'number', 'min="1"')}${field('Цена билета, ₽', 'admin.ne.price', ne.price, 'number', 'min="0"')}</div>

    <button class="btn" data-a="aCreateEvent" ${S.busy ? 'disabled' : ''}>Создать ивент</button>
  </div>`;

        <div class="grid2">${field('С (час)', `edit.discounts.${i}.start_hour`, d.start_hour, 'number', 'min="0" max="23"')}${field('До (час)', `edit.discounts.${i}.end_hour`, d.end_hour, 'number', 'min="1" max="24"')}</div>`
        : '<span class="small">Вручную — после проверки (пост, многодетная семья и т.п.)</span>'}
      <div class="between"><label class="row small"><input type="checkbox" style="width:20px;height:20px;accent-color:var(--pink)" data-bind="edit.discounts.${i}.active" ${d.active ? 'checked' : ''}> действует</label>
      <button class="btn2 sm" data-a="aDelDisc" data-id="${d.id}">Удалить</button></div></div>`).join('')}
  </div>
  <button class="btn" data-a="aSavePrices" ${S.busy ? 'disabled' : ''}>Сохранить всё</button>
  <div class="card"><b style="font-size:18px">Новая скидка</b>
    <div class="grid2">${field('Название', 'edit.nd.title', E.nd.title)}${field('%', 'edit.nd.percent', E.nd.percent, 'number')}</div>
    <div class="field"><label class="lbl" for="ndk">Как применяется</label><select id="ndk" data-bind="edit.nd.kind" data-rerender="1">
      <option value="time" ${E.nd.kind === 'time' ? 'selected' : ''}>Автоматически: дни и часы</option>
      <option value="manual" ${E.nd.kind === 'manual' ? 'selected' : ''}>Вручную</option></select></div>
    ${E.nd.kind === 'time' ? `<span class="lbl">Дни</span>${dowChips('edit.nd', E.nd.weekdays)}
      <div class="grid2">${field('С (час)', 'edit.nd.start', E.nd.start, 'number', 'min="0" max="23"')}${field('До (час)', 'edit.nd.end', E.nd.end, 'number', 'min="1" max="24"')}</div>
      <span class="small">Например: Пн, с 14 до 19 — скидка действует на часы 14:00–19:00</span>` : ''}
    <button class="btn2 pink" data-a="aAddDisc">Добавить скидку</button>
  </div>
  <div class="card"><b style="font-size:18px">Бот</b>
    <span class="muted">Подключает кнопки «Подтвердить / Отклонить» под чеками и ответы бота в чате. Нажать один раз после настройки.</span>
    <button class="btn2 pink" data-a="aWebhook">Подключить бота</button>
  </div>`;
}

function vAdminBroadcast() {
  return `<div class="card"><b style="font-size:18px">Рассылка</b>
    <span class="muted">Сообщение получат все клиенты, которые бронировали зал или записывались на ивенты.</span>
    <textarea data-bind="admin.bc" placeholder="Например: в субботу новый мастер-класс…">${esc(S.admin.bc)}</textarea>
    <button class="btn" data-a="aBroadcast" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Отправляем…' : 'Отправить всем'}</button></div>`;
}

function ensureAdmin() {
  if (S.screen !== 'admin') return;
  const A = S.admin;
  if (A.tab === 'day' && !A.day && !A.dayLoading) {
    A.dayLoading = true; const date = A.date;
    api('admin_day', { date }).then(r => {
      if (A.date !== date) return;
      A.day = r;
      const i = r.dayHours || { open_hour: S.data.settings.open_hour, close_hour: S.data.settings.close_hour, is_closed: false };
      A.dh = { open: i.open_hour, close: i.close_hour, closed: i.is_closed };
    }).catch(e => { A.day = { bookings: [], occupied: [], events: [], dayHours: null }; toast(e.message); })
      .finally(() => { A.dayLoading = false; render(); });
  }
  if (A.tab === 'events' && !A.events && !A.evLoading) {
    A.evLoading = true;
    api('admin_events').then(r => { A.events = r; })
      .catch(e => { A.events = []; toast(e.message); })
      .finally(() => { A.evLoading = false; render(); });
  }
}

async function sendEventBroadcast(id) {
  S.busy = true; render(); toast('Отправляем рассылку…');
  try {
    const r = await api('admin_event_broadcast', { id });
    toast(`Анонс отправлен: ${r.sent} из ${r.total}`);
  } finally { S.busy = false; render(); }
}

async function refreshAdmin() { S.admin.day = null; S.admin.events = null; await load(); }

// ---------- Отрисовка ----------
function render() {
  const app = document.getElementById('app');
  if (!S.data) {
    app.innerHTML = S.error
      ? `<div class="col center" style="margin-top:28vh;align-items:center"><span class="logo">MALO</span><div class="muted" style="margin-top:16px">${esc(S.error)}</div><button class="btn" data-a="reload">Повторить</button></div>`
      : '<div class="spin"></div>';
    return;
  }
  const V = { home: vHome, book: vBook, checkout: vCheckout, done: vDone, events: vEvents, event: vEvent, admin: vAdmin }[S.screen] || vHome;
  app.innerHTML = V() + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
  if (tg && tg.BackButton) { try { BACK[S.screen] ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
  ensureAdmin();
}
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }

// ---------- Действия ----------
const A = {
  back() { go(BACK[S.screen] || 'home'); },
  home() { go('home'); },
  reload() { S.error = null; render(); load(); },
  contact() { const url = 'https://t.me/' + CONTACT; tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url); },
  openBook() { if (!S.book.date) S.book.date = mskToday(); go('book'); },
  openEvents() { go('events'); },
  openEvent(d) { S.eventId = d.id; S.ticket = { qty: 1, method: 'transfer' }; go('event'); },
  openAdmin() { S.admin.date = S.admin.date || mskToday(); S.admin.tab = 'day'; S.admin.day = null; S.admin.events = null; go('admin'); },
  evFilter(d) { S.evFilter = d.v; render(); },
  pickDay(d) { S.book.date = d.date; S.book.hours = []; render(); },
  hour(d) { tapHour(+d.h); render(); },
  people(d) { S.book.people = Math.min(S.data.settings.hall_capacity || 40, Math.max(1, S.book.people + +d.v)); render(); },
  weeks(d) { S.book.weeks = Math.min(12, Math.max(2, S.book.weeks + +d.v)); render(); },
  tq(d) {
    const e = S.data.events.find(x => x.id === S.eventId);
    S.ticket.qty = Math.min(e ? e.seats_left : 1, Math.max(1, S.ticket.qty + +d.v)); render();
  },
  toCheckout() { if (S.book.hours.length) go('checkout'); },

  async submitBooking() {
    const f = S.form;
    if (!f.name.trim() || !f.phone.trim()) return toast('Укажите имя и телефон');
    if (S.busy) return;
    S.busy = true; render();
    try {
      try { tg && tg.requestWriteAccess && tg.requestWriteAccess(() => {}); } catch (e) {}
      const hs = S.book.hours;
      S.last = await api('create_booking', {
        name: f.name.trim(), phone: f.phone.trim(), purpose: f.purpose.trim(), method: f.method,
        date: S.book.date, start: Math.min(...hs), end: Math.max(...hs) + 1, people: S.book.people,
        weeks: S.book.repeat ? S.book.weeks : 1
      });
      S.book.hours = [];
      S.busy = false;
      await load();
      go('done');
    } finally { S.busy = false; render(); }
  },

  async cancelBooking(d) {
    if (!(await ask('Отменить эту бронь?'))) return;
    const r = await api('cancel_booking', { id: d.id });
    if (S.screen === 'admin') await refreshAdmin(); else await load();
    toast(r.refund ? 'Бронь отменена' : 'Бронь отменена. Предоплата не возвращается');
  },

  async buyTicket() {
    const e = S.data.events.find(x => x.id === S.eventId), f = S.form;
    if (!f.name.trim() || !f.phone.trim()) return toast('Укажите имя и телефон');
    if (S.busy) return;
    S.busy = true; render();
    try {
      try { tg && tg.requestWriteAccess && tg.requestWriteAccess(() => {}); } catch (e) {}
      await api('buy_ticket', {
        event_id: e.id, name: f.name.trim(), phone: f.phone.trim(), qty: S.ticket.qty,
        method: e.ticket_price > 0 ? S.ticket.method : 'cash'
      });
      S.busy = false;
      await load();
      go('home');
      toast('Вы записаны! Детали — в чате с ботом');
    } finally { S.busy = false; render(); }
  },

  // ----- админка -----
  aTab(d) { S.admin.tab = d.v; if (d.v === 'prices') initEdit(); render(); },
  aDay(d) { S.admin.date = d.date; S.admin.day = null; render(); },
  async aBlock(d) { await api('admin_block', { date: S.admin.date, start: +d.h, end: +d.h + 1, reason: 'Закрыто' }); await refreshAdmin(); },
  async aUnblock(d) { await api('admin_unblock', { date: S.admin.date, start: +d.h, end: +d.h + 1 }); await refreshAdmin(); },
  async setPay(d) { await api('admin_set_payment', { kind: d.kind, id: d.id, status: d.v }); await refreshAdmin(); toast('Сохранено'); },
  async aDayHours() {
    const h = S.admin.dh;
    if (!(h.open >= 0 && h.close <= 24 && h.close > h.open)) return toast('Проверьте часы');
    await api('admin_day_hours', { date: S.admin.date, open: h.open, close: h.close, closed: !!h.closed });
    await refreshAdmin(); toast('Часы сохранены');
  },
  async aDayReset() { await api('admin_day_hours', { date: S.admin.date, reset: true }); await refreshAdmin(); toast('Обычные часы'); },
  async aCancelEvent(d) {
    if (!(await ask('Отменить ивент? Участники получат сообщение.'))) return;
    await api('admin_cancel_event', { id: d.id }); await refreshAdmin(); toast('Ивент отменён');
  },
  async aCreateEvent() {
    const n = S.admin.ne;
    if (!n.title.trim() || !n.date || !(n.end > n.start) || !(n.capacity > 0)) return toast('Заполните название, дату, время и места');
    S.busy = true; render();
    try {
      const ev = await api('admin_create_event', { ...n, title: n.title.trim() });
      S.admin.ne = { title: '', kind: 'masterclass', host: '', date: '', start: 18, end: 20, capacity: 30, price: 0, description: '' };
      S.busy = false;
      await refreshAdmin(); toast('Ивент создан');
      if (ev && ev.id && await ask('Ивент создан! Разослать анонс всем клиентам?')) await sendEventBroadcast(ev.id);
    } finally { S.busy = false; render(); }
  },
  async aSavePrices() {
    const E = S.edit;
    const badDisc = E.discounts.find(d => !Number.isInteger(d.percent) || d.percent < 1 || d.percent > 100);
    if (badDisc) return toast(`Скидка «${badDisc.title}»: процент должен быть от 1 до 100. Чтобы выключить — снимите галочку`);
    if (E.discounts.some(d => !String(d.title || '').trim())) return toast('У каждой скидки должно быть название');
    if (E.tiers.some(t => !(t.price_per_hour >= 0))) return toast('Проверьте цены');
    const st = E.settings;
    if (!(st.close_hour > st.open_hour && st.open_hour >= 0 && st.close_hour <= 24)) return toast('Проверьте часы работы');
    if (!(st.prepay_percent >= 0 && st.prepay_percent <= 100)) return toast('Предоплата — от 0 до 100%');
    if (!(st.payment_wait_hours >= 1)) return toast('Время ожидания чека — минимум 1 час');
    const badTime = E.discounts.find(d => d.kind === 'time' && !(Number.isInteger(d.start_hour) && Number.isInteger(d.end_hour) && d.start_hour >= 0 && d.end_hour <= 24 && d.end_hour > d.start_hour));
    if (badTime) return toast(`Скидка «${badTime.title}»: проверьте часы`);
    const noDays = E.discounts.find(d => d.kind === 'time' && Array.isArray(d.weekdays) && !d.weekdays.length);
    if (noDays) return toast(`Скидка «${noDays.title}»: выберите хотя бы один день`);
    S.busy = true; render();
    try {
      await api('admin_prices', { tiers: E.tiers });
      await api('admin_settings', E.settings);
      await api('admin_discounts', { discounts: E.discounts });
      await load(); initEdit(); toast('Сохранено');
    } finally { S.busy = false; render(); }
  },
  async aAddDisc() {
    const n = S.edit.nd;
    if (!n.title.trim()) return toast('Укажите название скидки');
    if (!Number.isInteger(n.percent) || n.percent < 1 || n.percent > 100) return toast('Скидка должна быть от 1 до 100%');
    if (n.kind === 'time' && !(Number.isInteger(n.start) && Number.isInteger(n.end) && n.start >= 0 && n.end <= 24 && n.end > n.start)) return toast('Проверьте часы скидки');
    if (n.kind === 'time' && Array.isArray(n.weekdays) && !n.weekdays.length) return toast('Выберите хотя бы один день');
    await api('admin_discounts', { discounts: [{
      title: n.title.trim(), percent: n.percent, kind: n.kind,
      start_hour: n.kind === 'time' ? n.start : null, end_hour: n.kind === 'time' ? n.end : null,
      weekdays: n.kind === 'time' ? n.weekdays : null, active: true
    }] });
    await load(); initEdit(); render(); toast('Скидка добавлена');
  },
  async aDelDisc(d) {
    if (!(await ask('Удалить скидку?'))) return;
    await api('admin_discounts', { delete: +d.id }); await load(); initEdit(); render();
  },
  toggleDow(d) {
    const obj = getPath(d.path), x = +d.dow;
    let w = obj.weekdays ? [...obj.weekdays] : [0, 1, 2, 3, 4, 5, 6];
    w = w.includes(x) ? w.filter(y => y !== x) : [...w, x];
    obj.weekdays = w.length === 7 ? null : w.sort((a, b) => a - b);
    render();
  },
  async aEventBroadcast(d) {
    if (!(await ask('Разослать анонс этого ивента всем клиентам?'))) return;
    await sendEventBroadcast(d.id);
  },
  async aReceipt(d) {
    const r = await api('admin_receipt_url', { id: d.id });
    if (tg && tg.openLink && tg.initData) tg.openLink(r.url); else window.open(r.url);
  },
  async aWebhook() {
    await api('admin_setup_webhook');
    toast('Бот подключён');
  },
  async aBroadcast() {
    const text = S.admin.bc.trim();
    if (!text) return toast('Напишите текст');
    if (!(await ask('Отправить сообщение всем клиентам?'))) return;
    S.busy = true; render();
    try {
      const r = await api('admin_broadcast', { text });
      S.admin.bc = ''; toast(`Отправлено ${r.sent} из ${r.total}`);
    } finally { S.busy = false; render(); }
  }
};

// ---------- События ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  e.preventDefault();
  const fn = A[el.dataset.a];
  if (!fn) return;
  try { await fn(el.dataset, el); } catch (err) { S.busy = false; toast(err.message); }
});

function onBind(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.bind) return;
  if (e.type === 'change' && !['checkbox', 'radio', 'select-one'].includes(el.type)) return;
  let v = el.value;
  if (el.type === 'number') v = el.value === '' ? null : Number(el.value);
  if (el.type === 'checkbox') v = el.checked;
  if (el.type === 'radio' && !el.checked) return;
  setPath(el.dataset.bind, v);
  if (el.dataset.rerender) render();
}
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);

// Загрузка чека
document.addEventListener('change', async e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.receipt) return;
  const file = el.files && el.files[0];
  if (!file) return;
  S.uploading = el.dataset.receipt; render();
  try {
    const image = await compressImage(file);
    await api('upload_receipt', { id: S.uploading, image });
    S.uploading = null;
    await load();
    if (S.screen === 'done') go('home');
    toast('Чек отправлен на проверку');
  } catch (err) {
    toast(err.message);
  } finally {
    S.uploading = null; render();
  }
});

if (tg && tg.BackButton) tg.BackButton.onClick(() => A.back());

// Открытие сразу на ивенте по ссылке из рассылки (?event=...)
const startEvent = new URLSearchParams(location.search).get('event');
load().then(() => {
  if (startEvent && S.data && S.data.events.some(e => e.id === startEvent)) {
    S.eventId = startEvent; S.ticket = { qty: 1, method: 'transfer' }; go('event');
  }
});
</script>
</body>
